<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>조달 계약 대시보드</title>
  <link rel="stylesheet" href="./styles.css?v=folder-results-20261106" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="titleBlock">
        <p class="eyebrow">Public Procurement Dashboard</p>
        <h1>조달 계약 분석</h1>
      </div>
      <div class="datasetBadge">
        <span class="datasetLabel">폴더 분석 자료</span>
        <span id="fileName" class="fileName">게시 자료 확인 중</span>
      </div>
    </header>

    <section class="datasetInfo" aria-label="게시 자료 정보">
      <p id="dataStatus" class="dataStatus" role="status">게시 자료 확인 중</p>
      <dl class="datasetMeta">
        <div><dt>자료 반영 시각</dt><dd id="publishedAt">-</dd></div>
        <div><dt>계약기간</dt><dd id="datasetPeriod">-</dd></div>
        <div><dt>정기 갱신</dt><dd>매월 1일 09:00 · 토·일 제외</dd></div>
        <div><dt>데이터 버전</dt><dd id="datasetVersion">-</dd></div>
        <div class="sourceMeta"><dt>원본 CSV</dt><dd id="sourceFiles">-</dd></div>
        <div class="sourceMeta"><dt>검증 결과</dt><dd id="validationInfo">-</dd></div>
      </dl>
    </section>
    <section class="filters" aria-label="분석 조건">
      <label class="selectGroup itemSelectGroup">
        <span class="label">분야</span>
        <select id="itemSelect">
          <option value="안내전광판">안내전광판</option>
          <option value="기상전광판">기상전광판</option>
          <option value="교통정보전광판">교통정보전광판</option>
        </select>
      </label>
      <label class="selectGroup metricSelectGroup">
        <span class="label">지표</span>
        <select id="metricSelect">
          <option value="amount">계약금액</option>
          <option value="count">계약건수</option>
        </select>
      </label>
      <label class="selectGroup typeSelectGroup">
        <span class="label">계약 유형</span>
        <select id="procurementFilter">
          <option value="all">전체</option>
          <option value="excellent">우수조달</option>
          <option value="mas">MAS</option>
          <option value="innovation">혁신제품</option>
        </select>
      </label>
      <div class="dateGroup">
        <label>계약일자 시작<input id="dateFrom" type="date" /></label>
        <label>계약일자 종료<input id="dateTo" type="date" /></label>
      </div>
      <label class="searchBox">계약업체 검색<input id="companySearch" type="search" placeholder="업체명 입력" /></label>
    </section>

    <section class="summaryGrid" id="summaryGrid"></section>

    <section class="workspace">
      <div class="chartPanel">
        <div class="panelHead">
          <div>
            <h2 id="chartTitle">업체별 계약 현황</h2>
            <p id="chartSubTitle">계약금액 기준 면적 표시</p>
          </div>
          <button id="resetSelection" class="ghostButton" type="button">선택 해제</button>
        </div>
        <div id="treemap" class="treemap" role="list" aria-label="업체별 계약 트리맵"></div>
      </div>

      <aside class="detailPanel">
        <div class="panelHead detailHead">
          <div>
            <h2 id="detailTitle">업체 상세</h2>
            <p id="detailSubTitle">업체 타일을 선택하세요</p>
          </div>
        </div>
        <div id="companyStats" class="companyStats"></div>
        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th>계약일자</th>
                <th>조달방식</th>
                <th>세부품명</th>
                <th>물품식별</th>
                <th>조달방식구분</th>
                <th>업체</th>
                <th>수요기관</th>
                <th>계약명</th>
                <th>계약금액</th>
              </tr>
            </thead>
            <tbody id="detailRows">
              <tr><td colspan="9" class="empty">선택된 업체가 없습니다.</td></tr>
            </tbody>
          </table>
        </div>
      </aside>
    </section>
  </main>

  <script src="./vendor/papaparse.js"></script>
  <script src="./data-model.js"></script>
  <script src="./app.js?v=folder-results-20261106"></script>
</body>
</html>
